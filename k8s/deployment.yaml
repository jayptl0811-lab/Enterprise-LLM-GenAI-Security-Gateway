apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-security-gateway
  labels:
    app: ai-security-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-security-gateway
  template:
    metadata:
      labels:
        app: ai-security-gateway
    spec:
      containers:
        - name: gateway
          image: ai-security-gateway:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: ai-security-gateway
                  key: api-keys
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-security-gateway
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ai-security-gateway
                  key: redis-url
            - name: UPSTREAM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-security-gateway
                  key: upstream-base-url
                  optional: true
            - name: UPSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-security-gateway
                  key: upstream-api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-security-gateway
spec:
  selector:
    app: ai-security-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-security-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-security-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
