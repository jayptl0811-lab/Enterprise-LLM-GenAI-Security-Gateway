services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_KEYS: ${API_KEYS:-local-dev-key:demo-user:admin:engineering}
      DATABASE_URL: postgresql+psycopg://gateway:${POSTGRES_PASSWORD:-gateway-local}@postgres:5432/gateway
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT: ${RATE_LIMIT:-30}
      RATE_WINDOW_SECONDS: ${RATE_WINDOW_SECONDS:-60}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_data:
